# tmux config — ported out of normandy's home-manager `programs.tmux` so every box
# shares one definition instead of it living only on the Nix-managed one.
#
# Read from ~/.config/tmux/tmux.conf (tmux >= 3.1). Pairs with the `s` / `zj` / `sls`
# helpers in shell/fish/functions/evalir.fish.

# Mouse selection, scroll, and pane resize.
set -g mouse on

# Snappier escape handling for vim/neovim running inside tmux (default 500ms makes
# <Esc> feel laggy).
set -sg escape-time 10

# 1-indexed windows and panes — matches the keyboard number row.
set -g base-index 1
setw -g pane-base-index 1

# 256-color terminfo for programs running INSIDE tmux.
set -g default-terminal "tmux-256color"

# Truecolor: advertise 24-bit RGB for the outer terminal (Ghostty et al.) so colors
# aren't mangled inside tmux. xterm* matches xterm-ghostty and xterm-256color.
set -as terminal-features ",xterm*:RGB"

# Independent per-client views: `s` uses tmux session groups (each client gets its own
# grouped session); aggressive-resize then sizes each WINDOW to the client(s) actually
# viewing it, so clients on different windows don't clamp each other to the smaller size.
set -g aggressive-resize on
